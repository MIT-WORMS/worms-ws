services:
  worms:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      args:
        USERNAME: worms
        USER_UID: 1000
        USER_GID: 1000
    image: worms-ros-jazzy-runtime:latest
    container_name: worms-ros
    network_mode: host
    privileged: true
    restart: unless-stopped
    stdin_open: true
    tty: true
    working_dir: /home/worms-ws
    volumes:
      - ./:/home/worms-ws
      - /dev:/dev
    environment:
      ROS_DOMAIN_ID: "42"
      ROS_LOCALHOST_ONLY: "0"
      TERM: xterm-256color
    command: >
      bash -lc "
        source /opt/ros/$$ROS_DISTRO/setup.bash &&
        mkdir -p src &&
        vcs import src < worms.repos &&
        vcs pull src &&
        sudo apt-get update &&
        rosdep update || true &&
        rosdep install --from-paths src --ignore-src -y &&
        colcon build &&
        source /home/worms-ws/install/setup.bash &&
        sleep infinity
      "